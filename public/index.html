<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Generador de informes HyA</title><style>:root{color-scheme:light}html,body{margin:0}body{font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><script>window.HYA_AUTH=@@AUTH@@;</script></head><body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#f6f5f2; --paper:#ffffff; --card:#ffffff; --line:#e7e4dd; --line-2:#cfcabd;
  --ink:#1a1a1a; --muted:#66625a; --accent:#fbaa11; --accent-ink:#1a1a1a; --accent-soft:#fff3d6;
  --navy:#1a1a1a; --navy-ink:#ffffff;
  --drag:#ffe2c6; --drag-line:#e99a52; --ok:#1f7448; --ok-soft:#e1f3e8; --err:#b3261e; --err-soft:#fdeceb;
  --shadow:0 1px 2px rgba(26,26,26,.06),0 8px 20px rgba(26,26,26,.06);
  --f-disp:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Source Sans 3','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#111111; --paper:#191919; --card:#222222; --line:#2f2f2f; --line-2:#474747;
    --ink:#f3f1ec; --muted:#a8a398; --accent:#fbaa11; --accent-ink:#1a1a1a; --accent-soft:#33290f;
    --navy:#2e2e2e; --navy-ink:#f3f1ec;
    --drag:#4a3220; --drag-line:#b9702f; --ok:#58c58c; --ok-soft:#173326; --err:#ff8d7f; --err-soft:#3b1d1a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#111111; --paper:#191919; --card:#222222; --line:#2f2f2f; --line-2:#474747;
  --ink:#f3f1ec; --muted:#a8a398; --accent:#fbaa11; --accent-ink:#1a1a1a; --accent-soft:#33290f;
  --navy:#2e2e2e; --navy-ink:#f3f1ec;
  --drag:#4a3220; --drag-line:#b9702f; --ok:#58c58c; --ok-soft:#173326; --err:#ff8d7f; --err-soft:#3b1d1a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.3); color-scheme:dark;
}
.logo{display:block;height:auto}
.logo-d{display:none}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .logo-l{display:none}
  :root:not([data-theme="light"]) .logo-d{display:block}
}
:root[data-theme="dark"] .logo-l{display:none}
:root[data-theme="dark"] .logo-d{display:block}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ground)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.app{max-width:1260px;margin-inline:auto;display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
body[data-phase="content"] .app{grid-template-columns:minmax(0,1fr);max-width:880px}
body[data-phase="content"] .lib{display:none}
body[data-phase="dashboard"] .app{grid-template-columns:minmax(0,1fr);max-width:1080px}
body[data-phase="dashboard"] .lib,body[data-phase="dashboard"] .head{display:none}
body[data-phase="dashboard"] .main{background:none;border:0}
body[data-phase="dashboard"] .stage{padding:8px 0}

.lib{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:20px 16px 16px;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;min-width:0}
.lib-logo{margin-bottom:16px}
.lib-logo .logo{width:100%;max-width:200px}
.brand{margin:0;font:700 22px/1 var(--f-disp);letter-spacing:.01em}
.lib-sub{margin:4px 0 0;color:var(--muted);font-size:13px}
.eyebrow{margin:22px 0 10px;font-size:11px;letter-spacing:.12em;font-weight:600;color:var(--muted)}
.lib-list{display:flex;flex-direction:column;gap:10px}
.mod{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;width:100%;
  padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;transition:background .15s,border-color .15s}
.mod:hover:not(.added){border-color:var(--line-2)}
.mod .ico{width:40px;height:40px;border-radius:10px;background:var(--ground);display:grid;place-items:center;color:var(--ink)}
.mod .t{display:block;font-weight:600;font-size:14px;line-height:1.2}
.mod .s{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.mod .grip{color:var(--line-2)}
.mod.is-dragging{background:var(--drag);border-color:var(--drag-line)}
.mod.added{opacity:.55;cursor:default}
.mod.added .grip{color:var(--ok)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none}

.main{background:var(--paper);border:1px solid var(--line);border-radius:20px;min-width:0}
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);border-bottom:1px solid var(--line);border-radius:20px 20px 0 0;padding:14px 24px 14px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.back{display:inline-flex;gap:8px;align-items:center;background:none;border:0;padding:6px 8px;margin-left:-8px;border-radius:10px;font:600 16px var(--f-body)}
.back[disabled]{opacity:.35;cursor:default}
.save{font-size:13px;color:var(--muted);text-align:right}
.bar-r{display:flex;align-items:center;gap:12px;min-width:0}

.prog{display:flex;align-items:center;gap:12px;padding-top:30px}
.num{flex:none;width:32px;height:32px;border-radius:8px;background:var(--navy);color:var(--navy-ink);display:grid;place-items:center;font:700 16px var(--f-disp)}
.dots{list-style:none;margin:0;padding:0;display:flex;gap:10px;flex:1;min-width:0;align-items:center}
.dots li{position:relative;flex:0 1 16px;min-width:8px;height:16px}
.dotb{display:block;width:100%;height:100%;border-radius:50%;padding:0;border:1.5px solid var(--accent);background:var(--paper);opacity:.55;transition:background .2s,opacity .2s}
.dotb:hover{opacity:1}
.dotb[data-s="done"],.dotb[data-s="current"]{background:var(--accent);opacity:1}
.tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--navy);color:var(--navy-ink);font:700 12px var(--f-body);padding:2px 8px;border-radius:5px;white-space:nowrap;pointer-events:none}
.tip::after{content:"";position:absolute;top:100%;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:var(--navy);border-bottom:0}

.stage{padding:24px}
.stage-head .kick{margin:0 0 4px;font:600 11px var(--f-body);letter-spacing:.12em;color:var(--muted)}
.stage-head h2{margin:0;font:700 26px/1.15 var(--f-disp);text-wrap:balance}
.stage-head p{margin:6px 0 18px;color:var(--muted);max-width:62ch}
.canvas{border:1.5px dashed var(--line-2);border-radius:24px;padding:20px;min-height:340px;display:flex;flex-direction:column;gap:10px;transition:background .15s,border-color .15s}
.canvas.over{background:var(--drag);border-color:var(--drag-line)}
.empty{margin:auto;text-align:center;padding:32px 12px;color:var(--muted)}
.empty b{display:block;font:700 clamp(24px,4vw,34px)/1.1 var(--f-disp);color:var(--line-2);margin-bottom:8px;text-wrap:balance}
.empty span{font-size:17px}
.chip{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.chip.over{border-color:var(--drag-line);background:var(--drag)}
.chip .grip{color:var(--line-2);cursor:grab}
.chip .n{font:500 12px var(--f-mono);color:var(--muted);min-width:1.6em}
.chip .tt{font-weight:600;overflow-wrap:anywhere}
.chip .acts{display:flex;gap:2px}
.ib{width:34px;height:34px;display:grid;place-items:center;border:0;background:none;border-radius:9px;color:var(--muted)}
.ib:hover:not([disabled]){background:var(--ground);color:var(--ink)}
.ib[disabled]{opacity:.3;cursor:default}
.foot{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:20px;flex-wrap:wrap}
.foot .hint{color:var(--muted);font-size:13.5px;margin-right:auto;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:600 15px var(--f-body)}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line-2)}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:default}

.mcard{border:1px solid var(--line);border-radius:20px;background:var(--card);box-shadow:var(--shadow);padding:22px 24px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld label{font-weight:600;font-size:13px;color:var(--muted)}
.fld .help{font-size:12.5px;color:var(--muted)}
input[type=text],input[type=date],textarea{width:100%;padding:10px 12px;border:1px solid var(--line-2);border-radius:12px;background:var(--paper)}
textarea{resize:vertical;line-height:1.5}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.7}
code{font:500 12.5px var(--f-mono);background:var(--ground);padding:1px 5px;border-radius:5px}
.err{background:var(--err-soft);color:var(--err);border-radius:10px;padding:8px 12px;font-size:13.5px;margin-bottom:12px}

.varbar{display:flex;gap:12px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:16px}
.vb-info{min-width:0;flex:1 1 260px}
.vb-info b{display:block;font-size:13px;margin-bottom:6px}
.vb-row{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px}
.vb-row span{display:inline-flex;gap:6px;align-items:baseline;min-width:0}
.vb-row .val{font-weight:600;overflow-wrap:anywhere}
.vb-row .no{color:var(--err);font-weight:600}
.vb-note{font-size:13px;color:var(--muted)}
.vb-act{display:flex;gap:8px;flex-wrap:wrap}

.drop{border:1.5px dashed var(--line-2);border-radius:14px;padding:18px;text-align:center;background:var(--ground);transition:background .15s,border-color .15s;cursor:pointer;display:block;width:100%}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{display:block;font-size:15px}
.drop span{font-size:13px;color:var(--muted)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:14px}
.thumb{position:relative;border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--paper);min-width:0}
.thumb img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;background:var(--ground)}
.thumb .meta{margin-top:6px;font:400 12px var(--f-mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb .rm{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;background:var(--paper);border:1px solid var(--line-2);display:grid;place-items:center;color:var(--ink)}
.thumb input{margin-top:8px;padding:7px 10px;font-size:13.5px}
.sp-add{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.sp-add .lab{font-weight:600;font-size:13px;color:var(--muted);margin-right:4px}
.sp-add input{flex:1 1 200px;min-width:0}
.qchip{padding:6px 12px;border-radius:99px;border:1px solid var(--line-2);background:var(--paper);font-size:13.5px;font-weight:500}
.qchip:hover{border-color:var(--accent);background:var(--accent-soft)}
.space{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:14px}
.sp-head{display:flex;gap:8px;align-items:center;background:var(--accent-soft);padding:8px 10px 8px 14px}
.sp-head input{background:transparent;border:1px solid transparent;font:700 15px var(--f-disp);text-transform:uppercase;letter-spacing:.03em;padding:6px 8px}
.sp-head input:hover{border-color:var(--line-2)}
.sp-body{padding:14px}
.none{border:1.5px dashed var(--line-2);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}

.rcover{border:1px solid var(--line);border-radius:20px;background:var(--card);box-shadow:var(--shadow);padding:26px 26px 22px;margin-bottom:16px;position:relative}
.rcover .big{font:700 clamp(34px,7vw,52px)/1 var(--f-disp);color:var(--ink);padding-bottom:12px;border-bottom:4px solid var(--accent);margin:0 0 14px}
.rcover .sub{display:block;font:700 clamp(14px,2.6vw,18px) var(--f-body);letter-spacing:.04em;background:var(--accent);color:var(--accent-ink);padding:8px 12px;margin:0 0 20px}
.rcover .logo{width:200px;margin-bottom:22px}
.rcover .ap{font:700 20px var(--f-disp);margin:0}
.rcover .cj{font:600 16px var(--f-body);margin:2px 0 0}
.rcover .fe{color:var(--muted);margin:12px 0 0}
.rcover .el{margin:18px 0 0;font-size:13px;font-weight:700;border-left:3px solid var(--accent);padding-left:8px}
.rcover .el + div{white-space:pre-line;border-left:3px solid var(--accent);padding-left:8px}
.rsec{border:1px solid var(--line);border-radius:20px;background:var(--card);box-shadow:var(--shadow);padding:20px 24px;margin-bottom:16px}
.rhead{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-bottom:10px;margin-bottom:14px;border-bottom:3px solid var(--accent)}
.rhead h3{margin:0;font:700 19px/1.2 var(--f-disp);color:var(--ink);text-wrap:balance;min-width:0}
.rhead .l{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0}
.pill{flex:none;font:600 12px var(--f-body);padding:3px 10px;border-radius:99px;background:var(--ground);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.rtext p{margin:0 0 12px;text-align:justify;hyphens:auto}
.rtext p:last-child{margin-bottom:0}
.rimgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.rimgs img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.rspace{margin-top:14px}
.rspace h4{margin:0 0 10px;background:var(--accent-soft);border-left:4px solid var(--accent);padding:7px 12px;border-radius:4px;font:700 14px var(--f-disp);color:var(--navy);text-transform:uppercase;letter-spacing:.03em}
.rspace:first-child{margin-top:0}
.rimgs figure{margin:0}
.rimgs figcaption{font-size:12.5px;font-style:italic;color:var(--muted);text-align:center;margin-top:5px}

.dh{display:flex;gap:18px 24px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}
.dh-l{display:flex;gap:20px;align-items:center;min-width:0;flex-wrap:wrap}
.dh .logo{width:150px;flex:none}
.dh h1{margin:0;font:700 clamp(24px,4vw,32px)/1.1 var(--f-disp);text-wrap:balance}
.dh p{margin:4px 0 0;color:var(--muted)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 16px;min-width:120px}
.stat b{display:block;font:700 24px/1.1 var(--f-disp)}
.stat span{font-size:12.5px;color:var(--muted);font-weight:600}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.rc{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}
.rc-main{display:flex;flex-direction:column;gap:3px;text-align:left;background:none;border:0;padding:16px 16px 10px;border-radius:12px;width:100%;min-width:0}
.rc-main:hover .rc-t{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:3px}
.rc-t{font:700 18px/1.2 var(--f-disp);overflow-wrap:anywhere}
.rc-s{color:var(--muted);overflow-wrap:anywhere}
.rc-m{font-size:12.5px;color:var(--muted);margin-top:6px}
.rc-bar{height:6px;border-radius:99px;background:var(--line);margin:0 16px 12px;overflow:hidden}
.rc-bar i{display:block;height:100%;background:var(--accent)}
.rc-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 8px 12px 16px;margin-top:auto}
.rc-when{font-size:12.5px;color:var(--muted);margin-right:auto}
.rc-ask{display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%;font-size:13.5px}
.rc-ask span{margin-right:auto;font-weight:600}
.btn.danger{background:var(--err);border-color:var(--err);color:#fff}
.callout{border:1.5px dashed var(--line-2);border-radius:18px;padding:30px 20px;text-align:center;color:var(--muted)}
.callout b{display:block;font:700 22px/1.2 var(--f-disp);color:var(--ink);margin-bottom:6px}
.callout .btn{margin-top:14px}
.gen{border:1.5px solid var(--accent);border-radius:20px;padding:22px 24px;background:var(--accent-soft)}
.gen dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 18px;margin:0 0 16px}
.gen dt{font-size:12px;color:var(--muted);font-weight:600}
.gen dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.gen .msg{margin-top:14px;font-size:14px}
.gen .msg.ok{color:var(--ok)}
.gen .msg.bad{color:var(--err)}
.gen .fname{font:400 13px var(--f-mono);color:var(--muted);overflow-wrap:anywhere}
.gen .foot{margin-top:16px}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .lib{position:static;max-height:none;padding:16px}
  .lib-list{flex-direction:row;overflow-x:auto;padding-bottom:6px}
  .mod{min-width:230px;width:auto}
  .head{padding:12px 16px 12px}
  .prog{gap:10px}
  .dots{gap:6px}
  .stage{padding:16px}
  .mcard,.gen,.rsec{padding:18px 16px}
  .rcover{padding:20px 16px}
  .dh .logo{width:120px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

.shell{max-width:1000px;margin-inline:auto}
body[data-phase="editor"] .shell{max-width:880px}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted);min-width:0}
.crumbs button{background:none;border:0;padding:4px 6px;border-radius:8px;font:600 14px var(--f-body);color:var(--ink)}
.crumbs button:hover{background:var(--accent-soft)}
.crumbs .cur{font-weight:700;color:var(--ink);overflow-wrap:anywhere}
.stage.flat{padding:0}
.sec-h{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:26px 0 12px}
.sec-h h2{margin:0;font:700 20px/1.2 var(--f-disp)}
.sec-h p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.newp{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.newp input{flex:1 1 220px;min-width:0}
.dz{display:block;width:100%;border:2px dashed var(--line-2);border-radius:18px;padding:26px 18px;text-align:center;background:var(--paper);cursor:pointer;transition:background .15s,border-color .15s}
.dz:hover,.dz.over{border-color:var(--accent);background:var(--accent-soft)}
.dz b{display:block;font:700 18px var(--f-disp);margin-bottom:4px}
.dz span{color:var(--muted);font-size:14px}
.dz.busy{cursor:default;border-style:solid}
.prog2{margin-top:10px;font-size:13.5px;color:var(--muted)}
.prog2 .bar2{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.prog2 .bar2 i{display:block;height:100%;background:var(--accent);transition:width .2s}
.warns{margin:10px 0 0;padding:10px 14px;border-radius:12px;background:var(--err-soft);color:var(--err);font-size:13.5px}
.warns p{margin:0}

    if (driveEdit.open) {
      const dr = driveEdit.draft;
      const changed = (dr ? dr.id : '') !== (d ? d.id : '');
      box.appendChild(h('div', { class: 'dline' }, [
        h('span', { class: 'dico' }, [icon('folder')]),
        h('div', { class: 'dtxt' }, [h('b', { text: dr ? dr.name : 'Sin carpeta de Drive' }), h('small', { text: 'Elige la carpeta del proyecto, la que contiene una subcarpeta por torre. Los cambios se aplican al guardar.' })]),
        h('div', { class: 'mini' }, [
          h('button', { class: 'btn ghost sm', type: 'button', onclick: openPicker }, [icon('folder'), dr ? 'Cambiar carpeta' : 'Elegir carpeta']),
          dr ? h('button', { class: 'btn ghost sm', type: 'button', onclick: () => { driveEdit.draft = null; renderProject(); } }, ['Quitar']) : null
        ])
      ]));
      box.appendChild(h('div', { class: 'foot' }, [
        h('button', { class: 'btn ghost sm', type: 'button', onclick: () => { driveEdit = { open: false, draft: null }; renderProject(); } }, ['Cancelar']),
        h('button', { class: 'btn sm', type: 'button', disabled: changed ? null : true, onclick: async () => {
          const nd = driveEdit.draft ? { id: driveEdit.draft.id, name: driveEdit.draft.name } : null;
          await mutateProject((q) => { q.drive = nd; });
          driveEdit = { open: false, draft: null }; renderProject();
        } }, [icon('check'), 'Guardar'])
      ]));
      return box;
    }
    box.appendChild(h('div', { class: 'dline' }, [
      h('span', { class: 'dico' }, [icon('folder')]),
      h('div', { class: 'dtxt' }, [h('b', { text: d ? d.name : 'Sin carpeta de Drive' }), h('small', { text: d ? 'Carpeta vinculada. Cada subcarpeta es una torre y cada documento Google que empiece con «inf» es un informe.' : 'Vincula la carpeta del proyecto para traer los informes de cada torre.' })]),
      h('div', { class: 'mini' }, [
        d ? h('button', { class: 'btn sm', type: 'button', disabled: ds.busy ? true : null, onclick: syncDrive }, [icon('down'), ds.busy ? 'Sincronizando…' : 'Sincronizar con Drive']) : null,
        d ? h('button', { class: 'btn ghost sm', type: 'button', disabled: (driveExp.busy || !npend) ? true : null, onclick: () => exportDrive('') }, [icon('up'), driveExp.busy ? 'Exportando…' : 'Exportar completados' + (npend ? ' (' + npend + ')' : '')]) : null,
        h('button', { class: 'ib', type: 'button', title: 'Editar carpeta de Drive', 'aria-label': 'Editar carpeta de Drive', disabled: ds.busy ? true : null, onclick: () => { driveEdit = { open: true, draft: d ? { id: d.id, name: d.name } : null }; renderProject(); } }, [icon('pencil')])
      ])
    ]));
    if (ds.busy) box.appendChild(h('div', { class: 'prog2' }, [h('span', { text: ds.msg + (ds.total ? ' · ' + ds.done + ' de ' + ds.total : '') }), ds.total ? h('div', { class: 'bar2' }, [h('i', { style: 'width:' + Math.round(ds.done / ds.total * 100) + '%' })]) : null]));
    else if (ds.summary) box.appendChild(h('div', { class: 'prog2', text: ds.summary }));
    const de = driveExp.gid ? { busy: false, summary: '', errs: [] } : driveExp;
    if (de.busy) box.appendChild(h('div', { class: 'prog2' }, [h('span', { text: 'Exportando · ' + de.msg + (de.total ? ' · ' + de.done + ' de ' + de.total : '') }), de.total ? h('div', { class: 'bar2' }, [h('i', { style: 'width:' + Math.round(de.done / de.total * 100) + '%' })]) : null]));
    else if (de.summary) box.appendChild(h('div', { class: 'prog2', text: de.summary }));
    if (de.errs.length) box.appendChild(h('div', { class: 'warns' }, de.errs.slice(0, 8).map((w) => h('p', { text: w }))));
    if (ds.errs.length) box.appendChild(h('div', { class: 'warns' }, ds.errs.slice(0, 8).map((w) => h('p', { text: w })).concat(ds.errs.length > 8 ? [h('p', { text: 'Y ' + (ds.errs.length - 8) + ' más.' })] : [])));
    return box;
  }
  function refreshDriveUi() {
    if (view !== 'project') return;
    const old = document.querySelector('.dbar');
    const p = proj(PID);
    if (old && p && !modalOpen()) old.replaceWith(driveBar(p));
    else if (!modalOpen()) renderProject();
  }
  let pollT = null;
  function applySync(j) {
    const wasBusy = driveSync.busy;
    driveSync = { busy: !!j.busy, msg: j.msg || '', done: j.done || 0, total: j.total || 0, summary: j.summary || '', errs: j.errs || [] };
    return wasBusy;
  }
  async function pollSync() {
    clearTimeout(pollT); pollT = null;
    if (view !== 'project' || !PID) return;
    const pid = PID;
    try {
      const j = await api('/api/drive/sync?projectId=' + encodeURIComponent(pid));
      const was = applySync(j);
      refreshDriveUi();
      if (j.busy) pollT = setTimeout(pollSync, 1500);
      else if (was) { renderProject(); }
    } catch (e) { pollT = setTimeout(pollSync, 4000); }
  }
  let expT = null;
  async function pollExport() {
    clearTimeout(expT); expT = null;
    if (view !== 'project' || !PID) return;
    try {
      const j = await api('/api/drive/export?projectId=' + encodeURIComponent(PID));
      driveExp = { busy: !!j.busy, msg: j.msg || '', done: j.done || 0, total: j.total || 0, summary: j.summary || '', errs: j.errs || [], gid: j.gid || '' };
      if (driveExp.gid) { if (!modalOpen()) renderProject(); } else refreshDriveUi();
      if (j.busy) expT = setTimeout(pollExport, 1500);
    } catch (e) { expT = setTimeout(pollExport, 4000); }
  }
  async function exportDrive(gid) {
    if (driveExp.busy) return;
    const g = typeof gid === 'string' ? gid : '';
    driveExp = { busy: true, msg: 'Preparando…', done: 0, total: 0, summary: '', errs: [], gid: g };
    refreshDriveUi();
    try {
      await api('/api/drive/export?projectId=' + encodeURIComponent(PID) + (g ? '&groupId=' + encodeURIComponent(g) : ''), { method: 'POST' });
      expT = setTimeout(pollExport, 800);
    } catch (e) {
      driveExp = { busy: false, msg: '', done: 0, total: 0, summary: '', errs: [(e && e.message) || 'No se pudo exportar.'], gid: g };
    }
    if (g) renderProject(); else refreshDriveUi();
  }
  async function syncDrive() {
    const p0 = proj(PID);
    if (!p0 || !p0.drive || driveSync.busy) return;
    driveSync = { busy: true, msg: 'Buscando informes en Drive…', done: 0, total: 0, summary: '', errs: [] };
    refreshDriveUi();
    try {
      const j = await api('/api/drive/sync?projectId=' + encodeURIComponent(PID), { method: 'POST' });
      applySync(j);
      pollT = setTimeout(pollSync, 1000);
    } catch (e) {
      driveSync = { busy: false, msg: '', done: 0, total: 0, summary: '', errs: [(e && e.message) || 'No se pudo leer Drive.'] };
    }
    refreshDriveUi();
  }


  /* ---------- firma global ---------- */
  function openFirmas() {
    if (firmasOpen) return;
    firmasOpen = true;
    let draft = globalCfg.firma ? Object.assign({}, globalCfg.firma) : null;
    const added = [];
    let err = '', busy = false;
    const back = h('div', { class: 'modal-bg' });
    const close = () => { firmasOpen = false; back.remove(); };
    const cancel = () => { added.forEach((a) => { if (assets) assets.delete(a).catch(() => {}); }); close(); };
    back.addEventListener('mousedown', (e) => { back.dataset.down = e.target === back ? '1' : ''; });
    back.addEventListener('click', (e) => { if (e.target === back && back.dataset.down) cancel(); });
    back.addEventListener('keydown', (e) => { if (e.key === 'Escape') cancel(); });
    async function take(file) {
      try {
        const it = await fileToItem(file, 1600); await uploadItem(it);
        if (!it.aid) throw new Error('No se pudo subir la imagen.');
        added.push(it.aid); draft = { aid: it.aid, w: it.w, h: it.h }; err = '';
      } catch (x) { err = (x && x.message) || 'No se pudo leer esa imagen.'; }
      draw();
    }
    const fi = h('input', { type: 'file', accept: 'image/*', hidden: true, onchange: (e) => { const f = e.target.files[0]; e.target.value = ''; if (f) take(f); } });
    const fromDoc = docPicker('Tomarla de un Word', async (file) => {
      try {
        const r = await fetch('/api/firmas/extract', { method: 'POST', headers: { 'Content-Type': 'application/octet-stream' }, body: file });
        if (r.status === 401 && window.HYA_AUTH) { location.href = '/login'; return; }
        let j = null; try { j = await r.json(); } catch (x) {}
        if (!r.ok) err = (j && j.error) || 'No se pudo leer ese Word.';
        else if (!j.firma) err = 'Ese Word no trae ninguna imagen después del título de conclusiones.';
        else { added.push(j.firma.aid); draft = j.firma; err = ''; }
      } catch (x) { err = 'No se pudo enviar el archivo al servidor.'; }
      draw();
    }, 'Leyendo…');
    function draw() {
      back.innerHTML = '';
      const pv = draft ? h('div', { class: 'pv' }, [h('img', { src: '/_blob/' + draft.aid, alt: 'Firmas' })]) : h('div', { class: 'pv empty', text: 'Sin imagen de firmas' });
      const save = h('button', { class: 'btn', type: 'button', disabled: busy ? true : null, onclick: async () => {
        if (!db) { err = 'La base de datos no está disponible.'; draw(); return; }
        busy = true; draw();
        const old = globalCfg.firma && globalCfg.firma.aid;
        try {
          await db.doc('config/global').set({ firma: draft, updatedAt: Date.now() });
          globalCfg = { firma: draft };
          const keep = draft && draft.aid;
          added.filter((a) => a !== keep).concat(old && old !== keep ? [old] : []).forEach((a) => { if (assets) assets.delete(a).catch(() => {}); });
          close();
          if (view === 'editor' && step === 'conclusiones') renderStage();
        } catch (e) { busy = false; err = 'No se pudo guardar. Inténtalo de nuevo.'; draw(); }
      } }, [icon('check'), busy ? 'Guardando…' : 'Guardar']);
      const box = h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Firmas' }, [
        h('div', { class: 'modal-h' }, [h('div', null, [h('h2', { text: 'Firmas de los informes' }), h('p', { text: 'Una sola imagen para todos los proyectos. Se agrega al final de las conclusiones en cada Word.' })]), h('button', { class: 'ib', type: 'button', 'aria-label': 'Cerrar', onclick: cancel }, [icon('x')])]),
        h('div', { class: 'fimgbox' }, [pv]),
        err ? h('div', { class: 'err', role: 'alert', text: err }) : null,
        h('div', { class: 'foot' }, [
          h('button', { class: 'btn ghost sm', type: 'button', onclick: () => fi.click() }, [icon('img'), draft ? 'Cambiar imagen' : 'Subir imagen']), fi,
          draft ? h('button', { class: 'btn ghost sm', type: 'button', onclick: () => { draft = null; draw(); } }, [icon('trash'), 'Quitar']) : null,
          fromDoc,
          h('button', { class: 'btn ghost', type: 'button', onclick: cancel }, ['Cancelar']),
          save
        ])
      ]);
      back.appendChild(box);
    }
    draw();
    document.body.appendChild(back);
  }

  /* ---------- arranque ---------- */
  function renderAll() {
    setPhase(view === 'editor' ? 'editor' : view);
    const st = $('#stage');
    if (view === 'projects') { st.innerHTML = ''; renderProjects(st); }
    else if (view === 'project') renderProject();
    else renderStage();
  }
  function getCap(name) {
    if (!(window.claude && window.claude.use)) return Promise.resolve(null);
    try { return Promise.resolve(window.claude.use(name)).catch(() => null); } catch (e) { return Promise.resolve(null); }
  }
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('drop', (e) => e.preventDefault());
  $('#backBtn').addEventListener('click', () => { const i = stepIdx(); if (i > 0) goStep(STEPS[i - 1].id); });
  $('#homeBtn').addEventListener('click', showProject);
  renderAll();

  let restored = false;
  function tryRestore() {
    if (restored || !projReady || !repReady) return;
    restored = true;
    let o = null; try { o = JSON.parse(load('hya2-open') || 'null'); } catch (e) {}
    if (o && o.p && proj(o.p)) { if (o.r && reports.some((r) => r.id === o.r)) { PID = o.p; openReport(o.r); } else openProject(o.p); }
  }
  Promise.all([getCap('db'), getCap('assets')]).then((r) => {
    db = r[0]; assets = r[1];
    if (!db) { dbState = 'none'; renderAll(); return; }
    dbState = 'ok';
    db.collection('proyectos').orderBy('createdAt', 'desc').limit(200).onSnapshot((snap) => {
      projects = snap.docs.map((d) => {
        const nd = clone(d.data()), ex = projects.filter((x) => x.id === d.id)[0];
        if (ex) { Object.keys(ex.data).forEach((k) => { delete ex.data[k]; }); Object.assign(ex.data, nd); return ex; }
        return { id: d.id, data: nd };
      });
      projReady = true;
      if (view === 'projects') renderAll();
      else if (view === 'project' && !imp.busy && !modalOpen() && !document.activeElement.closest('.mcard, .grow')) renderProject();
      tryRestore();
    }, () => { projReady = true; renderAll(); });
    db.collection('informes2').orderBy('updatedAt', 'desc').limit(1000).onSnapshot((snap) => {
      reports = snap.docs.map((d) => ({ id: d.id, data: clone(d.data()) }));
      repReady = true;
      if (view === 'projects') renderAll();
      else if (view === 'project' && !imp.busy && !modalOpen() && !(document.activeElement && document.activeElement.closest && document.activeElement.closest('.mcard, .grow, .newp'))) renderProject();
      tryRestore();
    }, () => { repReady = true; renderAll(); });
  });
  if (window.HYA_AUTH) {
    const out = document.createElement('button');
    out.type = 'button'; out.textContent = 'Salir'; out.className = 'btn ghost sm';
    out.style.cssText = 'position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:30;box-shadow:0 2px 8px rgba(0,0,0,.15)';
    out.addEventListener('click', async () => { try { await fetch('/api/logout', { method: 'POST' }); } catch (e) {} location.href = '/login'; });
    document.body.appendChild(out);
  }
  getCap('db').then((d) => {
    if (!d) return;
    d.collection('config').onSnapshot((snap) => {
      const g = snap.docs.filter((x) => x.id === 'global')[0];
      if (g && !firmasOpen) globalCfg = { firma: (g.data() || {}).firma || null };
    }, () => {});
  });
  getCap('downloads');
  window.SPACES = (typeof SPACES !== 'undefined') ? SPACES : [];
})();

</script>

</body></html>
