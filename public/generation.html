<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: lista de modulos a la izquierda, trabajo y vista previa a la derecha, hoja de papel como unidad visual */
:root {
  --bg: #f2f4f3; --surface: #ffffff; --surface2: #e8eeec; --ink: #17201f; --muted: #566462; --line: #d1dad7;
  --accent: #12665e; --accent-ink: #ffffff; --chip: #d6ebe6; --chip-ink: #0b4a43; --warn: #a3480f; --warn-bg: #f8e6d8;
  --page: #ffffff; --page-ink: #1c2222; --page-line: #cfd6d3;
  --font-head: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif; --font-body: 'Inter', 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1514; --surface: #162120; --surface2: #1e2b2a; --ink: #e4edeb; --muted: #94a6a3; --line: #2b3a38;
    --accent: #4cc2b5; --accent-ink: #04201d; --chip: #1d3b37; --chip-ink: #a4e6dc; --warn: #f0a06a; --warn-bg: #3a2616;
    --page: #f7f9f8; --page-ink: #1c2222; --page-line: #3a4a48; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1514; --surface: #162120; --surface2: #1e2b2a; --ink: #e4edeb; --muted: #94a6a3; --line: #2b3a38;
  --accent: #4cc2b5; --accent-ink: #04201d; --chip: #1d3b37; --chip-ink: #a4e6dc; --warn: #f0a06a; --warn-bg: #3a2616;
  --page: #f7f9f8; --page-ink: #1c2222; --page-line: #3a4a48; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; }
h1, h2, h3 { font-family: var(--font-head); text-wrap: balance; margin: 0; }
button, select, input, textarea { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; }
.top h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
.top p { margin: 4px 0 0; color: var(--muted); max-width: 62ch; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; }

.btn:hover { border-color: var(--accent); }
.btn.main { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.sm { padding: 3px 8px; font-size: 12px; }
.btn.danger { color: var(--warn); }
.btn[disabled] { opacity: .5; cursor: default; }
.note { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.note b { color: var(--ink); font-weight: 600; }
.note.err { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
.drop { border: 1.5px dashed var(--line); border-radius: 10px; padding: 10px 14px; color: var(--muted); }
.drop.on { border-color: var(--accent); background: var(--chip); color: var(--chip-ink); }
.cols { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }

.mods { display: flex; flex-direction: column; gap: 4px; }
.mod { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px; align-items: center; border: 1px solid transparent; border-radius: 8px; padding: 6px 8px; cursor: pointer; background: transparent; text-align: left; width: 100%; }
.mod:hover { background: var(--surface2); }
.mod.on { background: var(--chip); border-color: var(--accent); }
.mod .t { font-weight: 500; overflow-wrap: anywhere; }
.mod .k { font-size: 12px; color: var(--muted); }
.mod .mv { display: flex; gap: 2px; }
.mod.sub { margin-left: 20px; width: calc(100% - 20px); border-left: 3px solid var(--line); border-radius: 4px 8px 8px 4px; }
.mod.sub .t { font-size: 13px; }
.namesbox { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; border-top: 1px solid var(--line); padding-top: 10px; }
.namesbox textarea { min-height: 160px; font: 12px/1.4 ui-monospace, monospace; }
.mini { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; width: 24px; height: 24px; cursor: pointer; line-height: 1; padding: 0; }
.mini:hover { border-color: var(--accent); }
.add { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; }
select, input[type=text], textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; width: 100%; min-width: 0; }
textarea { resize: vertical; min-height: 72px; line-height: 1.45; }
.main { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
.tab { background: transparent; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; cursor: pointer; font-weight: 500; color: var(--muted); }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); }

.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }

label.chk { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--ink); }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
textarea.big { min-height: 380px; font-size: 14px; line-height: 1.55; }
.row2 { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-end; }
.row2 select { width: auto; max-width: 100%; }
.blocks { display: flex; flex-direction: column; gap: 8px; }
.blk { border: 1px solid var(--line); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 6px; background: var(--bg); }
.blk .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.blk .row select { width: auto; max-width: 100%; }
.tag { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin-right: auto; }
.thumb { max-width: 160px; max-height: 110px; border-radius: 6px; border: 1px solid var(--line); object-fit: contain; background: #fff; }
.slot { border: 1.5px dashed var(--line); border-radius: 8px; padding: 14px; color: var(--muted); text-align: center; }
.chip { display: inline-block; background: var(--chip); color: var(--chip-ink); border-radius: 5px; padding: 0 6px; font-weight: 500; font-size: .92em; white-space: nowrap; }
.vtable { display: flex; flex-direction: column; gap: 8px; }
.vrow { display: grid; grid-template-columns: minmax(120px, 1fr) minmax(120px, 1fr) minmax(120px, 1.2fr) auto auto; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--bg); }
@media (max-width: 860px) { .vrow { grid-template-columns: minmax(0, 1fr); } }
.pages { display: flex; flex-direction: column; gap: 18px; align-items: center; background: var(--surface2); border-radius: 10px; padding: 18px 10px; overflow-x: auto; }
.pwrap { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.plabel { font-size: 12px; color: var(--muted); }
.page { background: var(--page); color: var(--page-ink); border: 1px solid var(--page-line); box-shadow: 0 1px 6px rgba(0, 0, 0, .12); padding: 7% 8%; font-family: Georgia, 'Times New Roman', serif; font-size: 13px; line-height: 1.5; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }

.steps { display: flex; flex-direction: column; gap: 8px; }

.step b { font-weight: 600; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.badge { font-size: 11px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; color: var(--muted); background: var(--surface); }
pre.json { margin: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow: auto; max-height: 520px; font-size: 12px; line-height: 1.45; }
.sr { position: absolute; left: -9999px; }
@media (prefers-reduced-motion: no-preference) { .btn, .mod, .tab { transition: background .12s, border-color .12s; } }
.drive { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.drive h2 { margin: 0; font-size: 15px; }
.drow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.drow input[type=text] { flex: 1 1 260px; min-width: 0; }
.dfolder { color: var(--muted); overflow-wrap: anywhere; min-width: 0; }
.picker { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; background: var(--surface2); }
.crumbs { display: flex; flex-wrap: wrap; gap: 4px; }
.crumb { border: 0; background: var(--surface); border-radius: 6px; padding: 3px 8px; cursor: pointer; font: inherit; color: var(--ink); }
.flist { display: flex; flex-direction: column; gap: 4px; max-height: 240px; overflow-y: auto; }
.fitem { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; cursor: pointer; font: inherit; color: var(--ink); }
.fitem:hover { border-color: var(--accent); }
.fills { display: flex; flex-direction: column; gap: 10px; }
.fcard { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); }
.ftitle { font-weight: 600; }
.ftext { min-height: 120px; width: 100%; box-sizing: border-box; font: inherit; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); resize: vertical; }
.frow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.thumbs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.thumbs .thumb { width: 64px; height: 64px; object-fit: cover; border-radius: 6px; }
.note.ok { background: var(--chip); color: var(--chip-ink); border-color: var(--accent); }

<div class="wrap" id="app"></div>
<script src="/vendor/jszip.min.js"></script>
<script>
(function () {

  var V = 'urn:schemas-microsoft-com:vml';
  var KEY = 'hya-generation-v1';
  var TYPES = {
    portada: { n: 'Portada', d: 'Paso con los datos de la portada: conjunto, apartamento, fecha y elaboradores.' },
    texto: { n: 'Texto', d: 'Paso con el texto editable. Las variables se llenan en cada informe.' },
    imagenes: { n: 'Imágenes y planos', d: 'Paso con las imágenes del módulo. Cada una tiene un rol: fija en todo el grupo, igual por subgrupo o propia de cada informe.' },
    galeria: { n: 'Fotos por espacio', d: 'Paso donde se suben las fotos de cada espacio, una por página.' },
    pegado: { n: 'Imágenes pegadas', d: 'Paso donde se pegan imágenes copiadas, por ejemplo desde Excel.' },
    tabla: { n: 'Tabla', d: 'Tabla del formato que se conserva igual en cada informe.' },
    firmas: { n: 'Firmas', d: 'Paso con la firma de quienes suscriben el informe.' }
  };
  var ROLES = { fija: 'Fija en todo el grupo', subgrupo: 'Igual por subgrupo', informe: 'Propia de cada informe' };

  var S = { namesOpen: false, namesText: '', dl: null, mods: [], vars: [], imgs: [], sel: 0, tab: 'mod', file: '', sample: true, busy: false, err: '', drag: false, confirmDel: false, copied: false };

  function guessTipo(name, idx) {

  function sampleData() {
    var mods = nameLines(TAB_LIST.join('\n')).map(function (x, i) { return newTab(x.n, x.nivel, i); });
    mods[1].text = 'El presente informe técnico documenta, localiza, cuantifica y presupuesta los daños presentados en las zonas comunes del conjunto residencial, como consecuencia del sismo ocurrido el 10 de agosto de 2026.\n\nSe presenta ante {{SEGURO}}, en el marco de la póliza No. {{POLIZA}} y el siniestro No. {{SINIESTRO}}.\n\nLa inspección fue realizada por profesionales de la arquitectura y la ingeniería civil, quienes verificaron en sitio las zonas comunes que conforman el conjunto.';
    mods[2].text = 'El presente informe se estructura por capítulos, correspondientes a los componentes inspeccionados. Para cada uno se presentan los hallazgos identificados.\n\n## PLANOS Y REGISTRO FOTOGRÁFICO\n\nEn este informe se exponen algunas de las fotos con los hallazgos correspondientes a cada espacio.';

    var vars = [
      { key: 'seguro', label: 'Aseguradora', ejemplo: 'SBS Seguros Colombia S.A.', global: true },
      { key: 'poliza', label: 'Póliza', ejemplo: '1000252', global: true },
      { key: 'siniestro', label: 'Siniestro', ejemplo: '003-535-1000101', global: true },
      { key: 'valor', label: 'Valor total', ejemplo: '$[VALOR TOTAL]', global: false }
    ];
    return { mods: mods, vars: vars };
  }
  var kids = function (el, n) { return Array.prototype.filter.call(el.children, function (c) { return c.localName === n; }); };

      var base = (R.name || (S.file ? S.file + ' (informe)' : 'Informe')).trim() + (styled ? '' : ' sin estilo');
      if (toDrive) {
        if (!D.folder) throw new Error('Elige una carpeta de Drive en el panel de arriba.');
        var j = await (await api('/api/drive/copy?folderId=' + encodeURIComponent(D.folder.id) + '&name=' + encodeURIComponent(base), { method: 'POST', headers: { 'Content-Type': 'application/octet-stream' }, body: blob })).json();
        R.msg = 'Informe guardado en Drive: "' + j.name + '" (carpeta ' + D.folder.name + ').';
      } else {
        await S.dl.save({ filename: base + '.docx', data: blob });
        R.msg = 'Informe generado: ' + base + '.docx';
      }
    } catch (e) { R.err = e.message || 'No se pudo generar el informe.'; }
    R.busy = false; render();
  }
  function fillPanel() {
    var vrows = S.vars.map(function (v) {
      var inp = h('input', { type: 'text', 'aria-label': v.label, placeholder: v.ejemplo || '' });
      inp.value = R.vals[v.key] || '';
      inp.addEventListener('input', function () { R.vals[v.key] = inp.value; saveR(); });
      return h('label', { class: 'f' }, [v.label, inp]);
    });
    var nm = h('input', { type: 'text', 'aria-label': 'Nombre del informe', placeholder: 'Nombre del informe' });
    nm.value = R.name; nm.addEventListener('input', function () { R.name = nm.value; saveR(); });
    var off = R.busy || S.busy ? true : null;
    return h('div', { class: 'panel' }, [
      h('h2', { text: 'Llenar informe' }),
      h('p', { class: 'hint', text: 'Prueba: llena el formato cargado con valores, textos e imágenes y genera el Word. Las imágenes y los textos de esta pestaña no se guardan al cerrar la página.' }),
      S.vars.length ? h('div', { class: 'grid2' }, vrows) : h('p', { class: 'hint', text: 'Este formato no tiene variables.' }),
      h('div', { class: 'fills' }, S.mods.map(fillCard)),
      h('div', { class: 'drow' }, [nm]),
      h('div', { class: 'drow' }, [
        h('button', { class: 'btn main', type: 'button', disabled: off, onclick: function () { genReport(true, false); } }, ['Generar Word con estilo']),
        h('button', { class: 'btn', type: 'button', disabled: off, onclick: function () { genReport(false, false); } }, ['Generar Word sin estilo']),
        h('button', { class: 'btn', type: 'button', disabled: off || !D.folder ? true : null, onclick: function () { genReport(true, true); } }, ['Guardar en Drive con estilo'])
      ]),
      R.err ? h('div', { class: 'note err', text: R.err }) : null,
      R.msg ? h('div', { class: 'note ok', text: R.msg }) : null
    ]);
  }
  function useSample() { var d = sampleData(); S.mods = d.mods; S.vars = d.vars; S.imgs = []; S.file = ''; S.sample = true; S.sel = 0; S.tab = 'mod'; S.err = ''; touch(); render(); }

  function render() {
    var fi = h('input', { type: 'file', accept: '.docx', class: 'sr', id: 'docx', tabindex: '-1' });
    fi.addEventListener('change', function () { if (fi.files[0]) loadDocx(fi.files[0]); });
    var tabs = [['mod', 'Módulo'], ['prev', 'Vista previa'], ['vars', 'Variables'], ['steps', 'Pasos del informe'], ['json', 'JSON'], ['fill', 'Llenar informe']];
    var body = S.tab === 'prev' ? previewPanel() : S.tab === 'vars' ? varsPanel() : S.tab === 'steps' ? stepsPanel() : S.tab === 'json' ? jsonPanel() : S.tab === 'fill' ? fillPanel() : modulePanel();
    var drop = h('div', { class: 'drop' + (S.drag ? ' on' : ''), text: S.busy ? 'Leyendo el Word…' : 'Arrastra aquí un Word (.docx) para cortarlo en módulos por sus títulos.' });
    drop.addEventListener('dragover', function (e) { e.preventDefault(); if (!S.drag) { S.drag = true; drop.classList.add('on'); } });
    drop.addEventListener('dragleave', function () { S.drag = false; drop.classList.remove('on'); });
    drop.addEventListener('drop', function (e) { e.preventDefault(); S.drag = false; if (e.dataTransfer.files[0]) loadDocx(e.dataTransfer.files[0]); });
    root.innerHTML = '';
    [
      h('header', { class: 'top' }, [
        h('div', null, [h('h1', { text: 'Generación de formato' }), h('p', { text: 'Lee el formato desde Drive, edítalo por módulos y guarda una copia en Drive.' })]),
        h('div', { class: 'tools' }, [fi, h('button', { class: 'btn main', type: 'button', disabled: S.busy ? true : null, onclick: function () { fi.click(); } }, ['Subir un Word']), h('button', { class: 'btn', type: 'button', onclick: useSample }, ['Cargar ejemplo']), h('button', { class: 'btn', type: 'button', disabled: S.dl && !S.busy ? null : true, title: S.dl ? 'Exporta el formato como Word con colores, bandas y pie de página de la app' : 'La descarga no está disponible en esta vista', onclick: function () { exportDocx(true); } }, ['Exportar Word con estilo']), h('button', { class: 'btn', type: 'button', disabled: S.dl && !S.busy ? null : true, title: S.dl ? 'Exporta el formato como Word sencillo, sin diseño' : 'La descarga no está disponible en esta vista', onclick: function () { exportDocx(false); } }, ['Exportar Word sin estilo'])])
      ]),
      drivePanel(),
      S.err ? h('div', { class: 'note err', text: S.err }) : null,
      h('div', { class: 'note' }, [S.sample ? h('span', null, [h('b', { text: 'Ejemplo: ' }), 'formato de zonas comunes armado a mano, para probar el editor.']) : h('span', null, [h('b', { text: S.file }), ' cortado en ' + S.mods.length + ' módulos y ' + S.vars.length + ' variables.']), h('span', { text: 'Los cambios se guardan en este navegador.' })]),
      drop,
      h('div', { class: 'cols' }, [
        listPanel(),
        h('div', { class: 'main' }, [h('div', { class: 'tabs', role: 'tablist' }, tabs.map(function (t) { return h('button', { class: 'tab' + (S.tab === t[0] ? ' on' : ''), type: 'button', role: 'tab', 'aria-selected': S.tab === t[0] ? 'true' : 'false', onclick: function () { S.tab = t[0]; render(); } }, [t[1]]); })), body])
      ])
    ].forEach(function (n) { if (n) root.appendChild(n); });
  }

  if (!load()) { var d = sampleData(); S.mods = d.mods; S.vars = d.vars; }
  render();
  S.dl = {
    save: function (o) {
      return new Promise(function (res) {
        var u = URL.createObjectURL(o.data), a = document.createElement('a');
        a.href = u; a.download = o.filename; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(u); }, 4000);
        res({ status: 'saved' });
      });
    }
  };
  render();
})();
</script>
