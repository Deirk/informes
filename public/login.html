<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generador de informes HyA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{--ground:#f6f5f2;--card:#ffffff;--line:#e7e4dd;--ink:#1a1a1a;--muted:#66625a;--accent:#fbaa11;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--ground:#111111;--card:#222222;--line:#2f2f2f;--ink:#f3f1ec;--muted:#a8a398;--err:#ff8d7f;color-scheme:dark}}
html,body{margin:0;min-height:100%}
body{background:var(--ground);color:var(--ink);font:16px 'Source Sans 3','Segoe UI',system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:16px;box-sizing:border-box}
form{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
h1{font:700 26px 'Bricolage Grotesque','Segoe UI',sans-serif;margin:0;padding-bottom:10px;border-bottom:4px solid var(--accent)}
p{margin:0;color:var(--muted)}
label{font-weight:600;font-size:14px}
input{font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:transparent;color:inherit;width:100%;box-sizing:border-box}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;font-weight:700;padding:12px 16px;border:0;border-radius:12px;background:var(--accent);color:#1a1a1a;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--err);font-size:14px;min-height:20px}
</style>
</head>
<body>
<form id="f">
<h1>Generador de informes</h1>
<p>Hoyos &amp; Arroyo. Ingresa la contraseña para continuar.</p>
<label for="pw">Contraseña</label>
<input id="pw" type="password" autocomplete="current-password" autofocus required>
<div class="err" id="err" role="alert"></div>
<button id="go" type="submit">Entrar</button>
</form>
<script>
document.getElementById('f').addEventListener('submit', async function (e) {
  e.preventDefault();
  var go = document.getElementById('go'), err = document.getElementById('err');
  go.disabled = true; err.textContent = '';
  try {
    var r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('pw').value }) });
    if (r.ok) { location.href = '/'; return; }
    var j = null; try { j = await r.json(); } catch (x) {}
    err.textContent = (j && j.error) || 'No se pudo entrar.';
  } catch (x) { err.textContent = 'No se pudo conectar con el servidor.'; }
  go.disabled = false;
});
</script>
</body>
</html>
